<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Concept 3 — Workbench Tabs · Tanque Studio</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="shared-data.js"></script>
<style>
:root{
  --bg:#0b1116; --surf1:#0f171d; --surf2:#162028; --surf3:#1e2a33;
  --border:rgba(120,200,195,.10); --border2:rgba(120,200,195,.18);
  --accent:#5aafaa; --accent-dim:rgba(90,175,170,.24); --accent-bg:rgba(90,175,170,.1);
  --text:#dcf3f0; --muted:#4d6864; --muted2:#7fa19d;
  --green:#4caf7a; --red:#d05f5f; --orange:#e0843a;
  --mono:'IBM Plex Mono',monospace; --sans:'Atkinson Hyperlegible',system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body,#root{height:100%;overflow:hidden;background:var(--bg);}
body{font-family:var(--sans);color:var(--text);}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-thumb{background:var(--surf3);border-radius:2px;}
button{font-family:var(--mono);cursor:pointer;background:none;border:none;color:inherit;}
input,textarea{font-family:var(--mono);color:var(--text);}
textarea{resize:none;outline:none;}
input:focus,textarea:focus{outline:none;}
input[type=range]{-webkit-appearance:none;width:100%;height:3px;border-radius:2px;background:var(--surf3);outline:none;cursor:pointer;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 0 0 2px var(--accent-dim);}

.app{position:fixed;inset:0;display:flex;flex-direction:column;}

/* tab bar */
.tabbar-outer{height:44px;background:var(--surf1);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 8px;flex-shrink:0;gap:4px;}
.wtab{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 6px;border-radius:8px;cursor:pointer;max-width:190px;}
.wtab:hover{background:rgba(255,255,255,.04);}
.wtab.active{background:var(--surf3);}
.wtab-thumb{width:26px;height:26px;border-radius:6px;flex-shrink:0;position:relative;background:linear-gradient(135deg,var(--surf3),var(--surf2));}
.wtab-thumb svg.ring{position:absolute;inset:-2px;transform:rotate(-90deg);}
.wtab .nm{font-family:var(--mono);font-size:11.5px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.wtab .model{font-family:var(--mono);font-size:9px;color:var(--muted);white-space:nowrap;}
.wtab.active .nm{color:var(--accent);}
.wtab-add{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--muted2);}
.wtab-add:hover{background:rgba(255,255,255,.05);}
.tabbar-right{margin-left:auto;display:flex;align-items:center;gap:10px;padding-right:8px;}
.dot{width:6px;height:6px;border-radius:50%;}
.launcher-btn{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted2);}
.launcher-btn:hover{background:rgba(255,255,255,.05);}

/* launcher popover */
.launcher-pop{position:fixed;top:46px;right:8px;z-index:90;width:220px;background:var(--surf2);border:1px solid var(--border2);border-radius:11px;
  box-shadow:0 20px 50px rgba(0,0,0,.5);padding:6px;}
.launcher-item{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:8px;cursor:pointer;}
.launcher-item:hover{background:rgba(255,255,255,.05);}
.launcher-item .lbl{font-family:var(--mono);font-size:12px;color:var(--muted2);flex:1;}
.launcher-item.active .lbl{color:var(--accent);}
.badge-labs{font-family:var(--mono);font-size:8.5px;font-weight:600;padding:1px 5px;border-radius:99;background:rgba(224,132,58,.18);color:var(--orange);}

/* body */
.body{flex:1;display:flex;flex-direction:column;min-height:0;position:relative;}
.canvas{flex:1;background:#070c10;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;}
.canvas .dotgrid{position:absolute;inset:0;background-image:radial-gradient(rgba(120,200,195,.06) 1px, transparent 1px);background-size:26px 26px;}

/* shelf */
.shelf{background:var(--surf1);border-top:1px solid var(--border2);flex-shrink:0;transition:height .22s cubic-bezier(.2,.8,.3,1);
  display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -10px 30px rgba(0,0,0,.3);}
.shelf-handle{height:44px;flex-shrink:0;display:flex;align-items:center;padding:0 14px;gap:10px;cursor:pointer;}
.shelf-grip{width:32px;height:4px;border-radius:2px;background:var(--border2);margin:0 auto;position:absolute;left:50%;top:6px;transform:translateX(-50%);}
.shelf-prompt-inline{flex:1;background:var(--surf2);border:1px solid var(--border);border-radius:7px;padding:6px 10px;font-family:var(--sans);font-size:12px;color:var(--muted2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.shelf-gen{position:relative;padding:6px 16px;border-radius:7px;font-family:var(--mono);font-size:11px;font-weight:600;background:var(--surf3);color:var(--accent);overflow:hidden;flex-shrink:0;}
.shelf-gen .fill{position:absolute;inset:0;background:var(--accent);z-index:0;transition:width .1s linear;}
.shelf-gen span{position:relative;z-index:1;mix-blend-mode:difference;}
.shelf-chevron{color:var(--muted2);flex-shrink:0;}

.shelf-tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;padding:0 10px;gap:2px;}
.shelf-tabs button{padding:8px 12px;font-family:var(--mono);font-size:11px;color:var(--muted2);border-bottom:2px solid transparent;}
.shelf-tabs button.active{color:var(--accent);border-color:var(--accent);font-weight:600;}
.shelf-content{flex:1;overflow-y:auto;padding:16px;display:flex;gap:20px;flex-wrap:wrap;}

.field-block{display:flex;flex-direction:column;gap:6px;}
.field-block textarea{width:280px;height:70px;background:var(--surf2);border:1px solid var(--border);border-radius:7px;padding:8px 10px;font-family:var(--sans);font-size:12.5px;line-height:1.5;}
.chip{padding:4px 10px;border-radius:99px;font-family:var(--mono);font-size:10.5px;color:var(--muted2);background:var(--surf2);border:1px solid var(--border);cursor:pointer;}
.chip.active{background:var(--accent-bg);color:var(--accent);border-color:var(--accent);}
.chip-wrap{display:flex;flex-wrap:wrap;gap:5px;width:200px;}
.model-card{width:150px;padding:8px;border-radius:8px;background:var(--surf2);border:1px solid var(--border);cursor:pointer;}
.model-card.sel{border-color:var(--accent);background:var(--accent-bg);}
.model-swatch{width:100%;height:32px;border-radius:5px;margin-bottom:6px;}
.model-card .nm{font-family:var(--mono);font-size:11px;}
.model-card .vr{font-family:var(--mono);font-size:9.5px;color:var(--muted);}
.dial{width:74px;text-align:center;}
.dial .val{font-family:var(--mono);font-size:17px;color:var(--accent);font-weight:600;}
.dial .lbl{font-family:var(--mono);font-size:9.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:2px;}
.lora-card{width:170px;padding:9px;border-radius:8px;background:var(--surf2);border:1px solid var(--border);}
.lora-card .nm{font-family:var(--mono);font-size:11px;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lora-card .w{font-family:var(--mono);font-size:10px;color:var(--accent);text-align:right;}
.dropzone{width:150px;height:82px;border:1.5px dashed var(--border2);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);font-family:var(--mono);font-size:10px;gap:6px;}
.gal-grid{display:flex;gap:8px;flex-wrap:wrap;width:100%;}
.gal-cell{width:70px;height:70px;border-radius:7px;position:relative;cursor:pointer;border:2px solid var(--border);background:linear-gradient(135deg,var(--surf3),var(--surf2));overflow:hidden;}
.gal-cell.sel{border-color:var(--accent);}
.gal-cell .lbl{position:absolute;bottom:0;left:0;right:0;text-align:center;font-family:var(--mono);font-size:8px;padding:2px 0;background:rgba(0,0,0,.55);}

/* secondary views */
.view{flex:1;overflow-y:auto;padding:36px 44px;}
.view-title{font-family:var(--mono);font-size:18px;font-weight:600;margin-bottom:4px;}
.view-sub{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-bottom:24px;}
.back-btn{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;color:var(--muted2);margin-bottom:18px;cursor:pointer;}
.back-btn:hover{color:var(--accent);}
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;max-width:960px;}
.proj-card{padding:16px;border-radius:9px;background:var(--surf1);border:1px solid var(--border);cursor:pointer;}
.proj-card:hover{border-color:var(--border2);}
.proj-card .icon{width:32px;height:32px;border-radius:7px;background:var(--accent-bg);color:var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:10px;}
.proj-card .nm{font-family:var(--mono);font-size:12.5px;margin-bottom:6px;word-break:break-all;}
.proj-card .meta{font-family:var(--mono);font-size:10.5px;color:var(--muted);}
.pill-tabs{display:inline-flex;gap:2px;background:var(--surf1);padding:4px;border-radius:9px;margin-bottom:20px;border:1px solid var(--border);}
.pill-tabs button{padding:6px 14px;border-radius:6px;font-family:var(--mono);font-size:11px;color:var(--muted2);}
.pill-tabs button.active{background:var(--accent);color:#0b1116;font-weight:600;}
.flow-track{display:flex;gap:12px;overflow-x:auto;max-width:960px;}
.flow-card{width:170px;flex-shrink:0;padding:12px;border-radius:9px;background:var(--surf1);border:1px solid var(--border);}
.flow-card.active{border-color:var(--accent);background:var(--accent-bg);}
.flow-card .kind{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
.flow-card .title{font-family:var(--mono);font-size:12px;margin-bottom:10px;}
.flow-status{font-family:var(--mono);font-size:9.5px;padding:2px 7px;border-radius:99;display:inline-block;}
.flow-status.done{background:rgba(76,175,122,.15);color:var(--green);}
.flow-status.active{background:var(--accent-bg);color:var(--accent);}
.flow-status.pending{background:rgba(255,255,255,.05);color:var(--muted);}
.settings-card{max-width:520px;background:var(--surf1);border:1px solid var(--border);border-radius:9px;margin-bottom:16px;overflow:hidden;}
.settings-card .hd{padding:9px 16px;border-bottom:1px solid var(--border);font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
.settings-row{display:flex;justify-content:space-between;align-items:center;padding:9px 16px;border-bottom:1px solid var(--border);}
.settings-row .k{font-family:var(--mono);font-size:12px;color:var(--muted2);}
.settings-row input{background:var(--surf2);border:1px solid var(--border);border-radius:5px;padding:4px 9px;font-size:11px;width:200px;text-align:right;}

.toast{position:fixed;bottom:60px;right:24px;z-index:70;padding:10px 14px;display:flex;align-items:center;gap:10px;
  background:var(--surf2);border:1px solid var(--border2);border-radius:9px;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:toastIn .25s ease-out;}
@keyframes toastIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.toast .thumb{width:34px;height:34px;border-radius:6px;background:linear-gradient(135deg,#5aafaa,#2f5f5c);flex-shrink:0;}
.toast .t{font-family:var(--mono);font-size:12px;}
.toast .s{font-family:var(--mono);font-size:10px;color:var(--muted2);}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useCallback, useEffect } = React;
const D = window.TD;

function Icon({ name, size=15 }) {
  const p = {
    brush: "M2 14c1-1 2-2 4-2 .5 0 1-.5 1-1L11 7 9 5 4.5 8.5c0 0-.5.5-1 .5C2.5 9 1 10 1 11c0 .8.5 1.5 1 2z",
    folder:"M1 4a1 1 0 011-1h4l1.5 2H14a1 1 0 011 1v6a1 1 0 01-1 1H2a1 1 0 01-1-1V4z",
    gear:  "M8 1v2M8 13v2M1 8h2M13 8h2M3.2 3.2l1.4 1.4M11.4 11.4l1.4 1.4M3.2 12.8l1.4-1.4M11.4 4.6l1.4-1.4",
    film:  "M1 3h14v10H1zM4 3v10M12 3v10",
    spark: "M8 2l1 3 3 1-3 1-1 3-1-3-3-1 3-1 1-3z",
    flow:  "M3 1h10v4H3zM3 11h10v4H3zM8 5v6",
    image: "M1 2h14v12H1zM4.5 6.5a1.5 1.5 0 100-3 1.5 1.5 0 000 3zM1 11l4-3 3 2.5 3-3.5 4 4",
    plus:  "M8 3v10M3 8h10",
    chevronUp:"M3 10l5-5 5 5",
    chevronDown:"M3 6l5 5 5-5",
    grid:  "M2 2h5v5H2zM9 2h5v5H9zM2 9h5v5H2zM9 9h5v5H9z",
    arrowLeft: "M9 3L4 8l5 5",
  };
  return <svg width={size} height={size} viewBox="0 0 16 16" fill="none"><path d={p[name]||p.image} stroke="currentColor" strokeWidth="1.2" strokeLinecap="round" strokeLinejoin="round"/></svg>;
}

const NAV_ICONS = { generate:'brush', dtProjects:'folder', storyFlow:'film', storyStudio:'spark', workflowBuilder:'flow', settings:'gear' };

function TabBar({ sessions, activeId, setActiveId, addSession, mode, setMode, launcherOpen, setLauncherOpen }) {
  return (
    <div className="tabbar-outer">
      {mode === 'workspaces' && sessions.map(s => (
        <div key={s.id} className={"wtab"+(activeId===s.id?' active':'')} onClick={() => setActiveId(s.id)}>
          <div className="wtab-thumb">
            {s.isGenerating && (
              <svg className="ring" width="30" height="30" viewBox="0 0 30 30">
                <circle cx="15" cy="15" r="13" stroke="rgba(90,175,170,.55)" strokeWidth="2" fill="none"
                  strokeDasharray={81.7} strokeDashoffset={81.7 - (s.progress/100)*81.7} strokeLinecap="round"/>
              </svg>
            )}
          </div>
          <div><div className="nm">{s.name}</div><div className="model">{s.modelShort}</div></div>
        </div>
      ))}
      {mode === 'workspaces' && <div className="wtab-add" onClick={addSession}><Icon name="plus" size={14}/></div>}
      {mode !== 'workspaces' && (
        <div className="back-btn-inline" style={{display:'flex',alignItems:'center',gap:8,padding:'0 8px',cursor:'pointer',color:'var(--muted2)'}} onClick={() => setMode('workspaces')}>
          <Icon name="arrowLeft" size={13}/><span style={{fontFamily:'var(--mono)',fontSize:11.5}}>Workspaces</span>
        </div>
      )}
      <div className="tabbar-right">
        <span className="dot" style={{background:'var(--green)'}} />
        <span style={{fontFamily:'var(--mono)',fontSize:10,color:'var(--green)'}}>connected</span>
        <div className="launcher-btn" onClick={() => setLauncherOpen(o=>!o)}><Icon name="grid" size={15}/></div>
      </div>
      {launcherOpen && (
        <div className="launcher-pop" onClick={e=>e.stopPropagation()}>
          {D.navItems.map(item => (
            <div key={item.id} className={"launcher-item"+((mode===item.id||(mode==='labs'&&item.labs)||(item.id==='generate'&&mode==='workspaces'))?' active':'')}
              onClick={() => { setMode(item.id==='generate' ? 'workspaces' : (item.labs ? 'labs' : item.id)); setLauncherOpen(false); }}>
              <Icon name={NAV_ICONS[item.id]} size={14} />
              <span className="lbl">{item.label}</span>
              {item.labs && <span className="badge-labs">Labs</span>}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function Shelf({ session, update, onGenerate }) {
  const [expanded, setExpanded] = useState(false);
  const [tab, setTab] = useState('Prompt');
  const st = session;
  const set = (k,v) => update(session.id, k, v);

  return (
    <div className="shelf" style={{ height: expanded ? 360 : 44, position:'relative' }}>
      <div className="shelf-grip" />
      <div className="shelf-handle" onClick={() => setExpanded(e => !e)}>
        <div className="shelf-prompt-inline" onClick={e=>e.stopPropagation()}>
          {st.prompt || 'Click to describe your image…'}
        </div>
        <div className="shelf-gen" onClick={(e) => { e.stopPropagation(); onGenerate(session.id); }}>
          <div className="fill" style={{ width: st.isGenerating ? `${st.progress}%` : '0%' }} />
          <span>{st.isGenerating ? `${st.progress}%` : 'GENERATE'}</span>
        </div>
        <div className="shelf-chevron"><Icon name={expanded ? 'chevronDown' : 'chevronUp'} size={14} /></div>
      </div>
      {expanded && (
        <React.Fragment>
          <div className="shelf-tabs">
            {['Prompt','Model','Params','LoRA','img2img','Gallery'].map(t => (
              <button key={t} className={tab===t?'active':''} onClick={() => setTab(t)}>{t}</button>
            ))}
          </div>
          <div className="shelf-content">
            {tab === 'Prompt' && (
              <React.Fragment>
                <div className="field-block"><textarea placeholder="Describe your image…" value={st.prompt} onChange={e=>set('prompt',e.target.value)} /></div>
                <div className="field-block"><textarea style={{width:200,color:'var(--muted2)'}} placeholder="Negative prompt…" value={st.negPrompt} onChange={e=>set('negPrompt',e.target.value)} /></div>
                <div className="field-block chip-wrap">{D.aspects.map(a => <div key={a} className={"chip"+(st.aspect===a?' active':'')} onClick={()=>set('aspect',a)}>{a}</div>)}</div>
              </React.Fragment>
            )}
            {tab === 'Model' && D.models.map(m => (
              <div key={m.id} className={"model-card"+(st.model===m.id?' sel':'')} onClick={()=>set('model',m.id)}>
                <div className="model-swatch" style={{background:`linear-gradient(135deg,${m.swatch[0]},${m.swatch[1]})`}} />
                <div className="nm">{m.name}</div><div className="vr">{m.variant}</div>
              </div>
            ))}
            {tab === 'Params' && (
              <React.Fragment>
                <div className="dial"><div className="val">{st.steps}</div><div className="lbl">Steps</div><input type="range" min={1} max={50} value={st.steps} onChange={e=>set('steps',+e.target.value)} /></div>
                <div className="dial"><div className="val">{st.cfg.toFixed(1)}</div><div className="lbl">CFG</div><input type="range" min={1} max={15} step={.5} value={st.cfg} onChange={e=>set('cfg',+e.target.value)} /></div>
                <div className="dial"><div className="val">{st.seed}</div><div className="lbl">Seed</div><input type="range" min={-1} max={99999} value={st.seed} onChange={e=>set('seed',+e.target.value)} /></div>
              </React.Fragment>
            )}
            {tab === 'LoRA' && D.loras.map(l => (
              <div key={l.id} className="lora-card">
                <div className="nm">{l.name}</div>
                <input type="range" min={0} max={1} step={.05} defaultValue={l.weight} />
                <div className="w">{l.weight.toFixed(2)}</div>
              </div>
            ))}
            {tab === 'img2img' && <div className="dropzone"><Icon name="image" size={18}/><span>drop image</span></div>}
            {tab === 'Gallery' && (
              <div className="gal-grid">
                {D.gallery.map(g => (
                  <div key={g.id} className={"gal-cell"+(st.gallerySel===g.id?' sel':'')} onClick={()=>set('gallerySel',g.id)}>
                    <div className="lbl" style={{color:g.source==='generated'?'var(--green)':'var(--muted2)'}}>{g.label}</div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </React.Fragment>
      )}
    </div>
  );
}

function Canvas({ session }) {
  return (
    <div className="canvas">
      <div className="dotgrid" />
      {!session.isGenerating && session.progress === 0 ? (
        <div style={{ textAlign:'center', color:'var(--muted)', position:'relative' }}>
          <Icon name="image" size={42} />
          <div style={{ fontFamily:'var(--sans)', fontSize:14, color:'var(--muted2)', marginTop:12 }}>No image yet</div>
          <div style={{ fontFamily:'var(--mono)', fontSize:10.5, marginTop:5 }}>Generate, or expand the shelf below</div>
        </div>
      ) : (
        <div style={{ width:400, height:400, borderRadius:14, background:'linear-gradient(135deg,var(--surf3),#070c10)',
          border:`2px solid ${session.isGenerating?'var(--accent-dim)':'var(--border)'}`, position:'relative',
          boxShadow: session.isGenerating ? '0 0 60px rgba(90,175,170,.14)' : 'none' }}>
          {session.isGenerating && (
            <div style={{ position:'absolute', inset:0, display:'flex', alignItems:'center', justifyContent:'center' }}>
              <div style={{ width:160, height:3, background:'var(--surf3)', borderRadius:2, overflow:'hidden' }}>
                <div style={{ height:'100%', width:`${session.progress}%`, background:'var(--accent)', transition:'width .1s linear' }} />
              </div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function DTProjectsView({ onBack }) {
  return (
    <div className="view">
      <div className="back-btn" onClick={onBack}><Icon name="arrowLeft" size={12}/> Workspaces</div>
      <div className="view-title">DT Project Browser</div>
      <div className="view-sub">Draw Things .sqlite3 projects</div>
      <div className="proj-grid">
        {D.dtProjects.map(p => (
          <div key={p.id} className="proj-card">
            <div className="icon"><Icon name="folder" size={16}/></div>
            <div className="nm">{p.name}</div>
            <div className="meta">{p.images} images · {p.updated}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

function LabsView({ onBack }) {
  const [sub, setSub] = useState('storyFlow');
  return (
    <div className="view">
      <div className="back-btn" onClick={onBack}><Icon name="arrowLeft" size={12}/> Workspaces</div>
      <div className="view-title">Labs</div>
      <div className="view-sub">Experimental workflows</div>
      <div className="pill-tabs">
        {['storyFlow','storyStudio','workflowBuilder'].map(s => (
          <button key={s} className={sub===s?'active':''} onClick={()=>setSub(s)}>{s==='storyFlow'?'StoryFlow':s==='storyStudio'?'Story Studio':'Workflow Builder'}</button>
        ))}
      </div>
      {sub==='storyFlow' ? (
        <div className="flow-track">
          {D.storyFlowSteps.map(s => (
            <div key={s.id} className={"flow-card"+(s.status==='active'?' active':'')}>
              <div className="kind">{s.kind}</div><div className="title">{s.title}</div>
              <span className={"flow-status "+s.status}>{s.status}</span>
            </div>
          ))}
        </div>
      ) : <div style={{color:'var(--muted)',fontFamily:'var(--mono)',fontSize:12}}>Coming soon</div>}
    </div>
  );
}

function SettingsView({ onBack }) {
  const sections = [
    { title:'DRAW THINGS CONNECTION', rows:[['Host','localhost'],['Port','7859']] },
    { title:'LLM ASSIST', rows:[['Provider','Ollama'],['Model','llama3.2']] },
  ];
  return (
    <div className="view">
      <div className="back-btn" onClick={onBack}><Icon name="arrowLeft" size={12}/> Workspaces</div>
      <div className="view-title">Settings</div><div className="view-sub">&nbsp;</div>
      {sections.map(s => (
        <div key={s.title} className="settings-card">
          <div className="hd">{s.title}</div>
          {s.rows.map(([k,v]) => <div key={k} className="settings-row"><span className="k">{k}</span><input defaultValue={v} /></div>)}
        </div>
      ))}
    </div>
  );
}

let sid = 3;
function App() {
  const [mode, setMode] = useState('workspaces');
  const [launcherOpen, setLauncherOpen] = useState(false);
  const [activeId, setActiveId] = useState(1);
  const [toast, setToast] = useState(null);
  const [sessions, setSessions] = useState([
    { id:1, name:'Portrait experiments', modelShort:'flux.1', prompt:'', negPrompt:'', model:'flux1-dev-q4', aspect:'1:1', steps:20, cfg:7.5, seed:42, isGenerating:false, progress:0, gallerySel:1 },
    { id:2, name:'Landscape ideas',       modelShort:'flux.2', prompt:'', negPrompt:'', model:'flux2-klein-4b', aspect:'16:9', steps:24, cfg:6, seed:7, isGenerating:false, progress:0, gallerySel:2 },
  ]);
  const timers = useRef({});

  const update = (id, k, v) => setSessions(ss => ss.map(s => s.id===id ? {...s,[k]:v} : s));

  const onGenerate = useCallback((id) => {
    setSessions(ss => ss.map(s => s.id===id ? {...s, isGenerating:true, progress:0} : s));
    timers.current[id] = setInterval(() => {
      setSessions(ss => ss.map(s => {
        if (s.id !== id) return s;
        const next = Math.min(s.progress+6,100);
        if (next>=100) {
          clearInterval(timers.current[id]);
          setToast({ t:`"${s.name}" finished`, s:'1024×1024 · '+s.modelShort });
          setTimeout(()=>setToast(null),3000);
          return {...s, progress:100, isGenerating:false};
        }
        return {...s, progress:next};
      }));
    }, 90);
  }, []);

  const addSession = () => {
    sid += 1;
    const id = sid;
    setSessions(ss => [...ss, { id, name:`Session ${id}`, modelShort:'flux.1', prompt:'', negPrompt:'', model:'flux1-dev-q4', aspect:'1:1', steps:20, cfg:7.5, seed:1, isGenerating:false, progress:0, gallerySel:null }]);
    setActiveId(id);
  };

  const active = sessions.find(s => s.id === activeId) || sessions[0];

  return (
    <div className="app" onClick={() => launcherOpen && setLauncherOpen(false)}>
      <TabBar sessions={sessions} activeId={activeId} setActiveId={setActiveId} addSession={addSession}
        mode={mode} setMode={setMode} launcherOpen={launcherOpen} setLauncherOpen={setLauncherOpen} />
      <div className="body">
        {mode === 'workspaces' && (
          <React.Fragment>
            <Canvas session={active} />
            <Shelf session={active} update={update} onGenerate={onGenerate} />
          </React.Fragment>
        )}
        {mode === 'dtProjects' && <DTProjectsView onBack={() => setMode('workspaces')} />}
        {mode === 'labs' && <LabsView onBack={() => setMode('workspaces')} />}
        {mode === 'settings' && <SettingsView onBack={() => setMode('workspaces')} />}
      </div>
      {toast && <div className="toast"><div className="thumb" /><div><div className="t">{toast.t}</div><div className="s">{toast.s}</div></div></div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
