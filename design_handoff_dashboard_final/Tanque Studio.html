<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Concept 4 — Dashboard + Focus Rooms · Tanque Studio</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="shared-data.js"></script>
<style>
:root{
  --bg:#f0ebe0; --surf1:#e8e0cc; --surf2:#ddd2ba; --surf3:#cfc5ad;
  --border:rgba(30,20,12,.10); --border2:rgba(30,20,12,.18);
  --brass:#8b4a25; --brass-dim:rgba(140,74,37,.22); --brass-bg:rgba(140,74,37,.09);
  --text:#1a140c; --muted:#8a7458; --muted2:#5c4a38;
  --green:#3f8a5c; --red:#b5453f; --orange:#b56a1f;
  --mono:'IBM Plex Mono',monospace; --sans:'Atkinson Hyperlegible',system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body,#root{height:100%;overflow:hidden;background:var(--bg);}
body{font-family:var(--sans);color:var(--text);}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-thumb{background:var(--surf3);border-radius:3px;}
button{font-family:var(--mono);cursor:pointer;background:none;border:none;color:inherit;}
input,textarea{font-family:var(--mono);color:var(--text);}
textarea{resize:none;outline:none;}
input:focus,textarea:focus{outline:none;}
input[type=range]{-webkit-appearance:none;width:100%;height:3px;border-radius:2px;background:var(--surf3);outline:none;cursor:pointer;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--brass);cursor:pointer;box-shadow:0 0 0 2px var(--brass-dim);}

.app{position:fixed;inset:0;display:flex;flex-direction:column;}
.topbar{height:56px;background:var(--surf1);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 22px;gap:14px;flex-shrink:0;}
.wordmark{display:flex;align-items:center;gap:9px;}
.wordmark img{width:24px;height:24px;border-radius:6px;}
.wordmark .t{font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.03em;}
.wordmark .s{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.08em;}
.breadcrumb{font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;}
.breadcrumb .seg{cursor:pointer;}
.breadcrumb .seg:hover{color:var(--brass);}
.breadcrumb .seg.current{color:var(--text);cursor:default;}
.topnav{display:flex;align-items:center;gap:4px;padding-left:14px;margin-left:2px;border-left:1px solid var(--border);}
.topnav .item{font-family:var(--mono);font-size:11.5px;letter-spacing:.02em;color:var(--muted2);padding:6px 10px;border-radius:6px;cursor:pointer;}
.topnav .item:hover{color:var(--text);background:var(--surf2);}
.topnav .item.active{color:var(--brass);background:var(--brass-bg);}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--surf2);border:1px solid var(--border);border-radius:8px;padding:6px 12px;width:220px;}
.search input{background:transparent;border:none;font-size:12px;flex:1;color:var(--text);}
.search input::placeholder{color:var(--muted);}
.conn{display:flex;align-items:center;gap:6px;margin-left:16px;}
.dot{width:6px;height:6px;border-radius:50%;}

.content{flex:1;overflow-y:auto;}

/* dashboard */
.dash{padding:32px 40px 60px;max-width:1120px;margin:0 auto;}
.dash-greeting{font-family:var(--mono);font-size:20px;font-weight:600;margin-bottom:4px;}
.dash-sub{font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:28px;}
.dash-grid{display:grid;grid-template-columns:2fr 1fr;gap:18px;margin-bottom:22px;}
.card{background:var(--surf1);border:1px solid var(--border);border-radius:14px;padding:20px;box-shadow:0 1px 2px rgba(30,20,12,.04);}
.card-lbl{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:14px;}
.continue-card{display:flex;gap:18px;align-items:center;}
.continue-thumb{width:110px;height:110px;border-radius:10px;background:linear-gradient(135deg,#cbb98f,#8b4a25);flex-shrink:0;}
.continue-prompt{font-family:var(--sans);font-size:13.5px;line-height:1.5;margin-bottom:10px;color:var(--muted2);}
.btn{padding:8px 16px;border-radius:8px;font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:.04em;}
.btn.primary{background:var(--brass);color:#fdf9f0;}
.btn.ghost{background:transparent;border:1px solid var(--border2);color:var(--muted2);}
.system-rows .row{display:flex;justify-content:space-between;padding:5px 0;font-family:var(--mono);font-size:11.5px;}
.system-rows .k{color:var(--muted);}
.system-rows .v{color:var(--muted2);}

.quickstart-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px;}
.qs-card{padding:16px;border-radius:12px;border:1px solid var(--border);cursor:pointer;background:var(--surf1);transition:transform .12s,box-shadow .12s;}
.qs-card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(30,20,12,.08);}
.qs-swatch{width:100%;height:56px;border-radius:8px;margin-bottom:10px;}
.qs-card .nm{font-family:var(--mono);font-size:12px;font-weight:600;}
.qs-card .desc{font-family:var(--sans);font-size:11px;color:var(--muted);margin-top:3px;}

.recent-strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;}
.recent-thumb{width:96px;height:96px;border-radius:9px;flex-shrink:0;cursor:pointer;position:relative;overflow:hidden;
  background:linear-gradient(135deg,var(--surf3),var(--surf2));border:1px solid var(--border);}
.recent-thumb .lbl{position:absolute;bottom:0;left:0;right:0;text-align:center;font-family:var(--mono);font-size:8.5px;padding:2px 0;background:rgba(30,20,12,.55);color:#f0ebe0;}

.two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.mini-row{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--border);}
.mini-row:last-child{border-bottom:none;}
.mini-icon{width:30px;height:30px;border-radius:8px;background:var(--brass-bg);color:var(--brass);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.mini-row .nm{font-family:var(--mono);font-size:12px;flex:1;}
.mini-row .meta{font-family:var(--mono);font-size:10.5px;color:var(--muted);}
.badge-labs{font-family:var(--mono);font-size:8.5px;font-weight:600;padding:1px 5px;border-radius:99;background:rgba(181,106,31,.16);color:var(--orange);margin-left:6px;}

/* focus room */
.focus{flex:1;display:flex;overflow:hidden;}
.focus-canvas-wrap{flex:1;display:flex;flex-direction:column;min-width:0;}
.focus-canvas{flex:1;background:#e2d8c0;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.focus-canvas .dotgrid{position:absolute;inset:0;background-image:radial-gradient(rgba(30,20,12,.06) 1px, transparent 1px);background-size:26px 26px;}
.focus-filmstrip{height:100px;background:var(--surf1);border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;padding:0 14px;flex-shrink:0;overflow-x:auto;}
.film-cell{width:76px;height:76px;border-radius:8px;flex-shrink:0;border:2px solid var(--border);position:relative;cursor:pointer;background:linear-gradient(135deg,var(--surf3),var(--surf2));overflow:hidden;}
.film-cell.sel{border-color:var(--brass);}
.film-cell.new{animation:pulseIn .5s ease-out;}
@keyframes pulseIn{0%{box-shadow:0 0 0 0 rgba(139,74,37,.5);}100%{box-shadow:0 0 0 10px rgba(139,74,37,0);}}
.film-cell .lbl{position:absolute;bottom:0;left:0;right:0;text-align:center;font-family:var(--mono);font-size:8px;padding:2px 0;background:rgba(30,20,12,.55);color:#f0ebe0;}

.drawer{width:320px;background:var(--surf1);border-left:1px solid var(--border);flex-shrink:0;display:flex;flex-direction:column;overflow-y:auto;}
.acc-item{border-bottom:1px solid var(--border);}
.acc-hd{padding:13px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
.acc-hd .t{font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;font-weight:600;}
.acc-hd .chev{color:var(--muted);transition:transform .15s;}
.acc-hd .chev.open{transform:rotate(180deg);}
.acc-body{padding:0 16px 16px;}
.applied-flash{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:9.5px;color:var(--green);opacity:0;transition:opacity .2s;}
.applied-flash.show{opacity:1;}

.gen-btn{position:relative;padding:8px 20px;border-radius:9px;font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.04em;
  background:var(--surf3);color:var(--brass);overflow:hidden;border:1px solid var(--border2);}
.gen-btn .fill{position:absolute;inset:0;background:var(--brass);z-index:0;transition:width .1s linear;}
.gen-btn span{position:relative;z-index:1;mix-blend-mode:difference;}

textarea.ta{width:100%;background:var(--surf2);border:1px solid var(--border);border-radius:7px;padding:8px 10px;font-family:var(--sans);font-size:12.5px;line-height:1.5;margin-top:6px;}
.chip-wrap{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
.chip{padding:4px 10px;border-radius:99px;font-family:var(--mono);font-size:10.5px;color:var(--muted2);background:var(--surf2);border:1px solid var(--border);cursor:pointer;}
.chip.active{background:var(--brass-bg);color:var(--brass);border-color:var(--brass);}
.model-card{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;border:1px solid var(--border);cursor:pointer;margin-top:8px;}
.model-card.sel{border-color:var(--brass);background:var(--brass-bg);}
.model-swatch{width:30px;height:30px;border-radius:7px;flex-shrink:0;}
.model-card .nm{font-family:var(--mono);font-size:12px;}
.model-card .vr{font-family:var(--mono);font-size:10px;color:var(--muted);}
.field-row{display:flex;justify-content:space-between;margin-top:10px;}
.field-row .k{font-family:var(--mono);font-size:11.5px;color:var(--muted2);}
.field-row .v{font-family:var(--mono);font-size:11.5px;color:var(--brass);}
.lora-row{display:flex;align-items:center;gap:8px;margin-top:10px;}
.lora-row .nm{font-family:var(--mono);font-size:11px;color:var(--muted2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.dropzone{border:1.5px dashed var(--border2);border-radius:9px;padding:18px 10px;text-align:center;color:var(--muted);font-family:var(--mono);font-size:11px;margin-top:8px;}
.mood-strip{display:flex;gap:6px;margin-top:8px;}
.mood-thumb{width:46px;height:46px;border-radius:6px;background:linear-gradient(135deg,var(--surf3),var(--surf2));border:1px solid var(--border);}

/* projects / labs / settings pages */
.page{padding:32px 40px;max-width:1000px;margin:0 auto;}
.page-title{font-family:var(--mono);font-size:18px;font-weight:600;margin-bottom:4px;}
.page-sub{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-bottom:24px;}
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;}
.proj-card{padding:16px;border-radius:11px;background:var(--surf1);border:1px solid var(--border);cursor:pointer;}
.proj-card:hover{border-color:var(--border2);}
.proj-card .icon{width:32px;height:32px;border-radius:8px;background:var(--brass-bg);color:var(--brass);display:flex;align-items:center;justify-content:center;margin-bottom:10px;}
.proj-card .nm{font-family:var(--mono);font-size:12.5px;margin-bottom:6px;word-break:break-all;}
.proj-card .meta{font-family:var(--mono);font-size:10.5px;color:var(--muted);}
.pill-tabs{display:inline-flex;gap:2px;background:var(--surf1);padding:4px;border-radius:9px;margin-bottom:20px;border:1px solid var(--border);}
.pill-tabs button{padding:6px 14px;border-radius:6px;font-family:var(--mono);font-size:11px;color:var(--muted2);}
.pill-tabs button.active{background:var(--brass);color:#fdf9f0;font-weight:600;}
.flow-track{display:flex;gap:12px;overflow-x:auto;}
.flow-card{width:170px;flex-shrink:0;padding:12px;border-radius:11px;background:var(--surf1);border:1px solid var(--border);}
.flow-card.active{border-color:var(--brass);background:var(--brass-bg);}
.flow-card .kind{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
.flow-card .title{font-family:var(--mono);font-size:12px;margin-bottom:10px;}
.flow-status{font-family:var(--mono);font-size:9.5px;padding:2px 7px;border-radius:99;display:inline-block;}
.flow-status.done{background:rgba(63,138,92,.15);color:var(--green);}
.flow-status.active{background:var(--brass-bg);color:var(--brass);}
.flow-status.pending{background:rgba(30,20,12,.05);color:var(--muted);}
.settings-card{max-width:520px;background:var(--surf1);border:1px solid var(--border);border-radius:11px;margin-bottom:16px;overflow:hidden;}
.settings-card .hd{padding:9px 16px;border-bottom:1px solid var(--border);font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
.settings-row{display:flex;justify-content:space-between;align-items:center;padding:9px 16px;border-bottom:1px solid var(--border);}
.settings-row .k{font-family:var(--mono);font-size:12px;color:var(--muted2);}
.settings-row .v{font-family:var(--mono);font-size:11.5px;color:var(--text);}
.settings-row .v.green{color:var(--green);}
.settings-row .v.muted{color:var(--muted);}
.settings-row input{background:var(--surf2);border:1px solid var(--border);border-radius:5px;padding:4px 9px;font-size:11px;width:220px;text-align:right;color:var(--text);}

.toast{position:fixed;bottom:24px;right:24px;z-index:70;padding:10px 14px;display:flex;align-items:center;gap:10px;
  background:var(--surf1);border:1px solid var(--border2);border-radius:10px;box-shadow:0 10px 30px rgba(30,20,12,.18);animation:toastIn .25s ease-out;}
@keyframes toastIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.toast .thumb{width:34px;height:34px;border-radius:6px;background:linear-gradient(135deg,#8b4a25,#cbb98f);flex-shrink:0;}
.toast .t{font-family:var(--mono);font-size:12px;}
.toast .s{font-family:var(--mono);font-size:10px;color:var(--muted);}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useCallback } = React;
const D = window.TD;

function Icon({ name, size=15 }) {
  const p = {
    folder:"M1 4a1 1 0 011-1h4l1.5 2H14a1 1 0 011 1v6a1 1 0 01-1 1H2a1 1 0 01-1-1V4z",
    spark: "M8 2l1 3 3 1-3 1-1 3-1-3-3-1 3-1 1-3z",
    gear:  "M8 1v2M8 13v2M1 8h2M13 8h2M3.2 3.2l1.4 1.4M11.4 11.4l1.4 1.4M3.2 12.8l1.4-1.4M11.4 4.6l1.4-1.4",
    image: "M1 2h14v12H1zM4.5 6.5a1.5 1.5 0 100-3 1.5 1.5 0 000 3zM1 11l4-3 3 2.5 3-3.5 4 4",
    search:"M11 11l3.5 3.5M12.5 7A5.5 5.5 0 111 7a5.5 5.5 0 0111.5 0z",
    chev:  "M4 6l4 4 4-4",
    check: "M3 8l3.5 3.5L13 5",
    film:  "M1 3h14v10H1zM4 3v10M12 3v10",
  };
  return <svg width={size} height={size} viewBox="0 0 16 16" fill="none"><path d={p[name]||p.image} stroke="currentColor" strokeWidth="1.3" strokeLinecap="round" strokeLinejoin="round"/></svg>;
}

const QUICKSTARTS = [
  { id:'portrait', nm:'Portrait', desc:'Studio lighting, 85mm', swatch:['#d9c9a8','#8b4a25'] },
  { id:'landscape', nm:'Landscape', desc:'Golden hour, wide', swatch:['#c9d9c0','#3f8a5c'] },
  { id:'product', nm:'Product Shot', desc:'Clean, softbox', swatch:['#d0d0d8','#5c5c78'] },
  { id:'concept', nm:'Concept Art', desc:'Painterly, dramatic', swatch:['#d9b9a8','#b5453f'] },
];

function TopBar({ crumb, onNav, connected, mode }) {
  return (
    <div className="topbar">
      <div className="wordmark" style={{cursor:'pointer'}} onClick={() => onNav('dashboard')}><img src="assets/icon_128x128.png" /><span className="t">TANQUE</span><span className="s">STUDIO</span></div>
      <div className="breadcrumb">
        {crumb.map((c,i) => (
          <React.Fragment key={i}>
            {i>0 && <span>/</span>}
            <span className={"seg"+(i===crumb.length-1?' current':'')} onClick={() => i<crumb.length-1 && onNav(c.id)}>{c.label}</span>
          </React.Fragment>
        ))}
      </div>
      <div className="topnav">
        <span className={"item"+(mode==='projects'?' active':'')} onClick={() => onNav('projects')}>Project Browser</span>
        <span className={"item"+(mode==='labs'?' active':'')} onClick={() => onNav('labs')}>Labs<span className="badge-labs">Labs</span></span>
        <span className={"item"+(mode==='settings'?' active':'')} onClick={() => onNav('settings')}>Settings</span>
      </div>
      <div className="search"><Icon name="search" size={12}/><input placeholder="Search…" /></div>
      <div className="conn"><span className="dot" style={{background:connected?'var(--green)':'var(--muted)'}} />
        <span style={{fontFamily:'var(--mono)',fontSize:10.5,color:connected?'var(--green)':'var(--muted)'}}>{connected?'connected':'offline'}</span></div>
    </div>
  );
}

function Dashboard({ onEnterFocus, onNav }) {
  return (
    <div className="dash">
      <div className="dash-greeting">Welcome back</div>
      <div className="dash-sub">Pick up where you left off, or start something new</div>

      <div className="dash-grid">
        <div className="card continue-card">
          <div className="continue-thumb" />
          <div style={{flex:1}}>
            <div className="card-lbl">Continue</div>
            <div className="continue-prompt">"Isometric cozy cabin, snow, warm windows" — flux.1 [dev] · 1:1</div>
            <button className="btn primary" onClick={() => onEnterFocus(5)}>Resume in Focus Room</button>
          </div>
        </div>
        <div className="card">
          <div className="card-lbl">System</div>
          <div className="system-rows">
            <div className="row"><span className="k">Draw Things</span><span className="v" style={{color:'var(--green)'}}>connected</span></div>
            <div className="row"><span className="k">LLM Assist</span><span className="v" style={{color:'var(--green)'}}>Ollama · llama3.2</span></div>
            <div className="row"><span className="k">Storage used</span><span className="v">2.4 GB</span></div>
          </div>
          <button className="btn ghost" style={{marginTop:12,width:'100%'}} onClick={() => onNav('settings')}>Open Settings</button>
        </div>
      </div>

      <div className="card-lbl" style={{marginBottom:12}}>Quick Start</div>
      <div className="quickstart-grid">
        {QUICKSTARTS.map(q => (
          <div key={q.id} className="qs-card" onClick={() => onEnterFocus(null)}>
            <div className="qs-swatch" style={{background:`linear-gradient(135deg,${q.swatch[0]},${q.swatch[1]})`}} />
            <div className="nm">{q.nm}</div><div className="desc">{q.desc}</div>
          </div>
        ))}
      </div>

      <div className="card-lbl" style={{marginBottom:12}}>Recent Generations</div>
      <div className="recent-strip" style={{marginBottom:22}}>
        {D.gallery.map(g => (
          <div key={g.id} className="recent-thumb" onClick={() => onEnterFocus(g.id)}>
            <div className="lbl" style={{color: g.source==='generated' ? '#bfe0cf' : '#e8e0cc'}}>{g.label}</div>
          </div>
        ))}
      </div>

      <div className="two-col">
        <div className="card">
          <div className="card-lbl">Projects</div>
          {D.dtProjects.slice(0,3).map(p => (
            <div key={p.id} className="mini-row" style={{cursor:'pointer'}} onClick={() => onNav('projects')}>
              <div className="mini-icon"><Icon name="folder" size={14}/></div>
              <span className="nm">{p.name}</span><span className="meta">{p.images} img</span>
            </div>
          ))}
          <button className="btn ghost" style={{marginTop:10,width:'100%'}} onClick={() => onNav('projects')}>View all projects</button>
        </div>
        <div className="card">
          <div className="card-lbl">Labs</div>
          <div className="mini-row" style={{cursor:'pointer'}} onClick={() => onNav('labs')}>
            <div className="mini-icon"><Icon name="film" size={14}/></div>
            <span className="nm">StoryFlow<span className="badge-labs">Labs</span></span><span className="meta">1 active</span>
          </div>
          <div className="mini-row" style={{cursor:'pointer'}} onClick={() => onNav('labs')}>
            <div className="mini-icon"><Icon name="spark" size={14}/></div>
            <span className="nm">Story Studio<span className="badge-labs">Labs</span></span><span className="meta">—</span>
          </div>
          <button className="btn ghost" style={{marginTop:10,width:'100%'}} onClick={() => onNav('labs')}>Open Labs</button>
        </div>
      </div>
    </div>
  );
}

function Accordion({ title, children, defaultOpen }) {
  const [open, setOpen] = useState(!!defaultOpen);
  return (
    <div className="acc-item">
      <div className="acc-hd" onClick={() => setOpen(o=>!o)}>
        <span className="t">{title}</span>
        <span className={"chev"+(open?' open':'')}><Icon name="chev" size={12}/></span>
      </div>
      {open && <div className="acc-body">{children}</div>}
    </div>
  );
}

function FocusRoom({ st, set, onGenerate, gallerySel, setGallerySel, newId }) {
  const [flash, setFlash] = useState(false);
  const applyFlash = () => { setFlash(true); setTimeout(()=>setFlash(false), 1400); };
  return (
    <div className="focus">
      <div className="focus-canvas-wrap">
        <div className="focus-canvas">
          <div className="dotgrid" />
          {!st.isGenerating && st.progress===0 ? (
            <div style={{textAlign:'center',color:'var(--muted)',position:'relative'}}>
              <Icon name="image" size={40} />
              <div style={{fontFamily:'var(--sans)',fontSize:14,color:'var(--muted2)',marginTop:12}}>No image yet</div>
              <div style={{fontFamily:'var(--mono)',fontSize:10.5,marginTop:5}}>Generate, or pick from the filmstrip below</div>
            </div>
          ) : (
            <div style={{width:380,height:380,borderRadius:14,background:'linear-gradient(135deg,#cbb98f,#8b4a25)',
              border:`2px solid ${st.isGenerating?'var(--brass-dim)':'var(--border)'}`,position:'relative',
              boxShadow: st.isGenerating ? '0 0 50px rgba(139,74,37,.18)' : '0 4px 20px rgba(30,20,12,.15)'}}>
              {st.isGenerating && (
                <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center'}}>
                  <div style={{width:150,height:3,background:'rgba(255,255,255,.35)',borderRadius:2,overflow:'hidden'}}>
                    <div style={{height:'100%',width:`${st.progress}%`,background:'#fdf9f0',transition:'width .1s linear'}} />
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
        <div className="focus-filmstrip">
          {D.gallery.map(g => (
            <div key={g.id} className={"film-cell"+(gallerySel===g.id?' sel':'')+(newId===g.id?' new':'')} onClick={()=>setGallerySel(g.id)}>
              <div className="lbl">{g.label}</div>
            </div>
          ))}
        </div>
      </div>
      <div className="drawer">
        <Accordion title="Prompt" defaultOpen>
          <textarea className="ta" rows={3} placeholder="Describe your image…" value={st.prompt} onChange={e=>set('prompt',e.target.value)} />
          <textarea className="ta" rows={2} placeholder="Negative prompt…" value={st.negPrompt} onChange={e=>set('negPrompt',e.target.value)} />
          <div className="chip-wrap">{D.aspects.map(a => <div key={a} className={"chip"+(st.aspect===a?' active':'')} onClick={()=>set('aspect',a)}>{a}</div>)}</div>
        </Accordion>
        <Accordion title="Model">
          {D.models.map(m => (
            <div key={m.id} className={"model-card"+(st.model===m.id?' sel':'')} onClick={()=>set('model',m.id)}>
              <div className="model-swatch" style={{background:`linear-gradient(135deg,${m.swatch[0]},${m.swatch[1]})`}} />
              <div><div className="nm">{m.name}</div><div className="vr">{m.variant}</div></div>
            </div>
          ))}
        </Accordion>
        <Accordion title="Parameters">
          <div className="field-row"><span className="k">Steps</span><span className="v">{st.steps}</span></div>
          <input type="range" min={1} max={50} value={st.steps} onChange={e=>set('steps',+e.target.value)} />
          <div className="field-row"><span className="k">CFG</span><span className="v">{st.cfg.toFixed(1)}</span></div>
          <input type="range" min={1} max={15} step={.5} value={st.cfg} onChange={e=>set('cfg',+e.target.value)} />
          <div className="field-row"><span className="k">Seed</span><span className="v">{st.seed}</span></div>
          <input type="range" min={-1} max={99999} value={st.seed} onChange={e=>set('seed',+e.target.value)} />
        </Accordion>
        <Accordion title="LoRAs">
          {D.loras.map(l => (
            <div key={l.id} className="lora-row">
              <span className="nm">{l.name}</span>
              <input type="range" min={0} max={1} step={.05} defaultValue={l.weight} style={{width:70}} />
              <span style={{fontFamily:'var(--mono)',fontSize:10.5,color:'var(--brass)'}}>{l.weight.toFixed(2)}</span>
            </div>
          ))}
        </Accordion>
        <Accordion title="img2img & Moodboard">
          <div className="dropzone">drop image here</div>
          <div className="mood-strip">{D.gallery.slice(0,3).map(g=><div key={g.id} className="mood-thumb"/>)}</div>
        </Accordion>
        <Accordion title="Actions">
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
            <button className="btn ghost" style={{width:'100%'}} onClick={applyFlash}>Paste Config from DT</button>
          </div>
          <span className={"applied-flash"+(flash?' show':'')}><Icon name="check" size={10}/> Applied</span>
        </Accordion>
        <div style={{padding:16,marginTop:'auto'}}>
          <div className="gen-btn" style={{width:'100%',textAlign:'center'}} onClick={onGenerate}>
            <div className="fill" style={{width: st.isGenerating?`${st.progress}%`:'0%'}} />
            <span>{st.isGenerating ? `${st.progress}%` : 'Generate'}</span>
          </div>
        </div>
      </div>
    </div>
  );
}

function ProjectsPage() {
  return (
    <div className="page">
      <div className="page-title">Projects</div>
      <div className="page-sub">Draw Things .sqlite3 projects</div>
      <div className="proj-grid">
        {D.dtProjects.map(p => (
          <div key={p.id} className="proj-card">
            <div className="icon"><Icon name="folder" size={16}/></div>
            <div className="nm">{p.name}</div>
            <div className="meta">{p.images} images · {p.updated}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

function LabsPage() {
  const [sub, setSub] = useState('storyFlow');
  return (
    <div className="page">
      <div className="page-title">Labs</div>
      <div className="page-sub">Experimental workflows</div>
      <div className="pill-tabs">
        {['storyFlow','storyStudio','workflowBuilder'].map(s => (
          <button key={s} className={sub===s?'active':''} onClick={()=>setSub(s)}>{s==='storyFlow'?'StoryFlow':s==='storyStudio'?'Story Studio':'Workflow Builder'}</button>
        ))}
      </div>
      {sub==='storyFlow' ? (
        <div className="flow-track">
          {D.storyFlowSteps.map(s => (
            <div key={s.id} className={"flow-card"+(s.status==='active'?' active':'')}>
              <div className="kind">{s.kind}</div><div className="title">{s.title}</div>
              <span className={"flow-status "+s.status}>{s.status}</span>
            </div>
          ))}
        </div>
      ) : <div style={{color:'var(--muted)',fontFamily:'var(--mono)',fontSize:12}}>Coming soon</div>}
    </div>
  );
}

function SettingsPage() {
  const sections = [
    { title:'DRAW THINGS CONNECTION', rows:[
      ['Host','localhost',true], ['Port','7859',true],
      ['Transport','gRPC'], ['Status','connected','green'],
    ]},
    { title:'LLM ASSIST', rows:[
      ['Provider','Ollama'], ['Host','http://localhost:11434',true],
      ['Model','llama3.2:latest'], ['Status','connected','green'],
    ]},
    { title:'IMAGE STORAGE', rows:[
      ['Save generated','enabled'], ['Location','~/Library/…/GeneratedImages'], ['Auto-save','on'],
    ]},
    { title:'APPEARANCE', rows:[
      ['Theme','System (auto)'], ['Gallery width','110 px'], ['More options','Coming soon','muted'],
    ]},
  ];
  return (
    <div className="page">
      <div className="page-title">Settings</div><div className="page-sub">&nbsp;</div>
      {sections.map(s => (
        <div key={s.title} className="settings-card">
          <div className="hd">{s.title}</div>
          {s.rows.map(([k,v,mod]) => (
            <div key={k} className="settings-row">
              <span className="k">{k}</span>
              {mod === true
                ? <input defaultValue={v} />
                : <span className={"v" + (mod === 'green' ? ' green' : mod === 'muted' ? ' muted' : '')}>{v}</span>}
            </div>
          ))}
        </div>
      ))}
      <div style={{ display:'flex', gap:10, marginTop:2 }}>
        <button className="btn ghost">Test Connection</button>
        <button className="btn primary">Save</button>
      </div>
    </div>
  );
}

function App() {
  const [mode, setMode] = useState('dashboard'); // dashboard | focus | projects | labs | settings
  const [gallerySel, setGallerySel] = useState(null);
  const [newId, setNewId] = useState(null);
  const [toast, setToast] = useState(null);
  const [st, setSt] = useState({ prompt:'', negPrompt:'', model:'flux1-dev-q4', aspect:'1:1', steps:20, cfg:7.5, seed:42, isGenerating:false, progress:0 });
  const timerRef = useRef(null);
  const set = (k,v) => setSt(s => ({...s,[k]:v}));

  const onGenerate = useCallback(() => {
    if (st.isGenerating) return;
    setSt(s => ({...s, isGenerating:true, progress:0}));
    timerRef.current = setInterval(() => {
      setSt(s => {
        const next = Math.min(s.progress+6,100);
        if (next>=100) {
          clearInterval(timerRef.current);
          setToast({ t:'Generated in 3.4s', s:'1024×1024 · flux.1 [dev]' });
          setNewId(1);
          setTimeout(()=>setToast(null),3200);
          setTimeout(()=>setNewId(null),700);
          return {...s, progress:100, isGenerating:false};
        }
        return {...s, progress:next};
      });
    }, 90);
  }, [st.isGenerating]);

  const crumbFor = () => {
    if (mode === 'dashboard') return [{id:'dashboard',label:'Dashboard'}];
    if (mode === 'focus') return [{id:'dashboard',label:'Dashboard'},{id:'focus',label:'Focus Room'}];
    if (mode === 'projects') return [{id:'dashboard',label:'Dashboard'},{id:'projects',label:'Projects'}];
    if (mode === 'labs') return [{id:'dashboard',label:'Dashboard'},{id:'labs',label:'Labs'}];
    if (mode === 'settings') return [{id:'dashboard',label:'Dashboard'},{id:'settings',label:'Settings'}];
  };

  return (
    <div className="app">
      <TopBar crumb={crumbFor()} onNav={setMode} connected={true} mode={mode} />
      <div className="content" style={ mode==='focus' ? { display:'flex', overflow:'hidden' } : {} }>
        {mode === 'dashboard' && <Dashboard onEnterFocus={(id) => { setGallerySel(id); setMode('focus'); }} onNav={setMode} />}
        {mode === 'focus' && <FocusRoom st={st} set={set} onGenerate={onGenerate} gallerySel={gallerySel} setGallerySel={setGallerySel} newId={newId} />}
        {mode === 'projects' && <ProjectsPage />}
        {mode === 'labs' && <LabsPage />}
        {mode === 'settings' && <SettingsPage />}
      </div>
      {toast && <div className="toast"><div className="thumb" /><div><div className="t">{toast.t}</div><div className="s">{toast.s}</div></div></div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
